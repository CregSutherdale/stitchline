<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Stitchline</title>
<meta name="description" content="A cozy, genuinely hard threading puzzle. One thread, every hole, once.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stitchline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#efe4d1">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600..700,100,1&family=Nunito:wght@700;800&display=swap">
<style>:root {
  --ink: #3a2b33; --ink2: #6b5862; --cream: #fbf5ea; --paper: #f6eedf; --line: rgba(58, 43, 51, 0.14);
  --madder: #c9473e; --madder-d: #9b3029; --gold: #e3a63c; --sage: #8fa88b; --denim: #6f8cab; --plum: #7a4c6a;
  --card: rgba(255, 251, 244, 0.86); --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 6px 18px -8px rgba(80, 45, 35, 0.35), 0 2px 4px rgba(80, 45, 35, 0.08);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --display: 'Fraunces', 'Iowan Old Style', Georgia, serif; --ui: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background-color: #efe4d1; background-repeat: repeat; color: var(--ink); font-family: var(--ui);
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
svg { display: block; }
#app { min-height: 100dvh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }

/* ---------- shared ---------- */
.topbar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding: calc(10px + var(--safe-t)) 14px 6px; }
.tb-title { text-align: center; min-width: 0; }
.tb-title h2 { margin: 0; font: 650 21px/1.15 var(--display); letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-title p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink2); font-weight: 700; letter-spacing: .3px; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.ghost { background: none; box-shadow: none; }
.icon-btn:active, .card:active, .tool:active, .patch:active, .btn:active, .pill:active { transform: translateY(1px) scale(.98); }
.toast { position: fixed; left: 50%; bottom: calc(108px + var(--safe-b)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  max-width: min(92vw, 420px); background: #3a2b33; color: #fbf3e6; padding: 11px 16px; border-radius: 14px; font-weight: 700; font-size: 14px; text-align: center;
  transition: .25s ease; z-index: 50; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- home ---------- */
.home { flex: 1; display: flex; flex-direction: column; padding: calc(18px + var(--safe-t)) 18px calc(14px + var(--safe-b)); gap: 10px; }
.brand { text-align: center; margin-top: 6px; }
.brand h1 { margin: 0; font: 700 50px/1 var(--display); letter-spacing: -0.5px; color: var(--ink); font-variation-settings: 'SOFT' 100, 'WONK' 1; }
.brand-stitch { width: 210px; height: 12px; margin: 6px auto 0; }
.brand-stitch path { fill: none; stroke: var(--madder); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 9 7; animation: run 2.4s linear infinite; }
@keyframes run { to { stroke-dashoffset: -32; } }
.tag { margin: 8px 0 0; color: var(--ink2); font-weight: 700; font-size: 14px; letter-spacing: .3px; }
.hero { flex: 1; min-height: 180px; max-height: 300px; display: grid; place-items: center; }
.hero-cv { width: min(64vw, 260px); height: min(64vw, 260px); }
.menu { display: flex; flex-direction: column; gap: 10px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { display: flex; align-items: center; gap: 10px; text-align: left; padding: 13px 13px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); position: relative; min-height: 64px; }
.card .card-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: #f3e6d1; color: var(--madder-d); flex: none; }
.card .card-ic svg { width: 22px; height: 22px; }
.card-tx { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.card-tx b { font: 650 17px/1.2 var(--display); }
.card-tx small { color: var(--ink2); font-weight: 700; font-size: 12.5px; margin-top: 2px; }
.card.primary { background: linear-gradient(180deg, #d4554b, #b93d35); color: #fff7ee; min-height: 74px; box-shadow: 0 1px 0 rgba(255,255,255,.3) inset, 0 10px 22px -10px rgba(150, 40, 30, .7); }
.card.primary::after { content: ''; position: absolute; inset: 5px; border-radius: 14px; border: 1.6px dashed rgba(255, 240, 225, .55); pointer-events: none; }
.card.primary .card-ic { background: rgba(255,255,255,.18); color: #fff; }
.card.primary small { color: rgba(255, 240, 228, .9); }
.card.primary b { font-size: 20px; }
.card-meta { display: flex; align-items: center; gap: 4px; font-weight: 800; font-size: 15px; }
.card-meta i svg { width: 17px; height: 17px; color: #ffd27a; }
.card-meta.col { flex-direction: column; align-items: flex-end; font-size: 13px; color: var(--ink2); gap: 2px; }
.badge { position: absolute; top: -7px; right: 8px; background: var(--gold); color: #4a2c06; font-weight: 800; font-size: 11.5px; padding: 3px 8px; border-radius: 99px; box-shadow: 0 2px 6px rgba(120,80,0,.3); }
.home-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.pill { display: flex; align-items: center; gap: 6px; padding: 9px 13px; border-radius: 99px; background: var(--card); box-shadow: var(--shadow); font-weight: 800; font-size: 13.5px; }
.pill i svg, .hint-count i svg { width: 18px; height: 18px; }
.hint-count { display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 13.5px; color: var(--ink2); }

/* ---------- levels ---------- */
.levels { padding: 4px 16px calc(24px + var(--safe-b)); display: flex; flex-direction: column; gap: 18px; }
.chapter { background: var(--card); border-radius: 22px; padding: 14px 14px 16px; box-shadow: var(--shadow); position: relative; }
.chapter::before { content: ''; position: absolute; inset: 6px; border-radius: 17px; border: 1.5px dashed var(--line); pointer-events: none; }
.ch-head { display: flex; align-items: baseline; justify-content: space-between; margin: 2px 4px 12px; gap: 8px; }
.ch-head h3 { margin: 0; font: 650 19px var(--display); display: flex; align-items: center; gap: 8px; }
.ch-head h3 span { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--cream); font: 800 13px var(--ui); }
.ch-head p { margin: 0; color: var(--ink2); font-weight: 700; font-size: 12px; text-align: right; }
.patches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
.patch { aspect-ratio: 1; border-radius: 12px; background-image: var(--fab); background-size: 36px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 3px 8px -3px rgba(70, 40, 30, .45), 0 0 0 1px rgba(70,40,30,.08); overflow: hidden; }
.patch::before { content: ''; position: absolute; inset: 0; background: rgba(255, 250, 240, .62); }
.patch::after { content: ''; position: absolute; inset: 4px; border-radius: 8px; border: 1.4px dashed rgba(70, 45, 40, .38); }
.patch.done::before { background: rgba(255, 250, 240, .22); }
.patch .pn { position: relative; z-index: 1; font: 800 17px var(--ui); color: var(--ink); background: rgba(255,251,244,.92); padding: 0 6px; border-radius: 8px; line-height: 1.35; }
.patch .ps { position: relative; z-index: 1; display: flex; gap: 1px; margin-top: 3px; }
.patch .ps i svg { width: 11px; height: 11px; color: rgba(70, 50, 50, .28); }
.patch .ps i.on svg { color: #f2b230; filter: drop-shadow(0 1px 0 rgba(120,70,0,.5)); }
.patch .pl { position: relative; z-index: 1; margin-top: 2px; }
.patch .pl svg { width: 14px; height: 14px; color: var(--ink2); }
.patch.locked { filter: grayscale(.85); opacity: .55; }
.patch.current { box-shadow: 0 0 0 3px var(--madder), 0 6px 14px -4px rgba(150, 40, 30, .6); animation: bob 1.8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-2px); } }

/* ---------- play ---------- */
.play { flex: 1; display: flex; flex-direction: column; min-height: 100dvh; }
.status { display: flex; justify-content: space-between; align-items: center; padding: 4px 18px 0; font-weight: 800; font-size: 13.5px; color: var(--ink2); gap: 8px; }
.status .clock { font-variant-numeric: tabular-nums; font-size: 16px; color: var(--ink); }
.mode-chip { background: rgba(255,251,244,.7); padding: 4px 10px; border-radius: 99px; }
.stage { flex: 1; position: relative; display: flex; min-height: 0; padding: 8px 10px; }
.board-wrap { flex: 1; position: relative; min-height: 0; }
.board-cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.teach { position: absolute; left: 14px; right: 14px; top: 2px; z-index: 5; pointer-events: none; }
.teach-card { pointer-events: auto; background: rgba(255, 250, 241, .96); border-radius: 16px; padding: 11px 40px 11px 14px; box-shadow: 0 10px 26px -12px rgba(60, 30, 20, .55); position: relative; animation: drop .35s ease; border: 1.5px dashed rgba(201, 71, 62, .45); }
.teach-card h4 { margin: 0 0 3px; font: 650 16.5px var(--display); color: var(--madder-d); }
.teach-card p { margin: 0; font-weight: 700; font-size: 14px; line-height: 1.35; }
.teach-card ul { margin: 4px 0 0; padding-left: 18px; font-weight: 700; font-size: 13.5px; line-height: 1.45; }
.teach-card .x { position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; display: grid; place-items: center; color: var(--ink2); }
.teach-card .x svg { width: 18px; height: 18px; }
@keyframes drop { from { transform: translateY(-10px); opacity: 0; } }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 6px 16px calc(14px + var(--safe-b)); }
.tool { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0 9px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); font-weight: 800; font-size: 13px; position: relative; }
.tool i svg { width: 25px; height: 25px; }
.hint-btn b { position: absolute; top: 6px; right: calc(50% - 30px); min-width: 20px; height: 20px; border-radius: 99px; background: var(--gold); color: #4a2c06; font-size: 11.5px; display: grid; place-items: center; padding: 0 5px; }

/* ---------- endless / chest / howto / settings ---------- */
.endless, .chest, .howto, .settings { padding: 6px 16px calc(24px + var(--safe-b)); display: flex; flex-direction: column; gap: 12px; }
.card.big { min-height: 92px; padding: 18px; }
.card.big b { font-size: 22px; }
.diff-medium { border-left: 7px solid var(--sage); }
.diff-hard { border-left: 7px solid var(--denim); }
.diff-expert { border-left: 7px solid var(--plum); }
.note { color: var(--ink2); font-weight: 700; font-size: 13px; text-align: center; margin: 6px 12px; }
.empty { text-align: center; padding: 60px 30px; color: var(--ink2); font-weight: 700; }
.empty svg { width: 54px; height: 54px; margin: 0 auto 10px; }
.quilt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; padding: 10px; border-radius: 16px; background: #f2e7d5; box-shadow: var(--shadow), 0 0 0 6px #e2cfb0 inset; }
.qcell { aspect-ratio: 1; display: block; }
.qcell canvas { width: 100%; height: 100%; display: block; }
.rule { display: flex; gap: 14px; align-items: center; background: var(--card); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); }
.rule-cv { width: 96px; height: 96px; flex: none; }
.rule h3 { margin: 0 0 4px; font: 650 17px var(--display); }
.rule p, .tips p { margin: 0; font-weight: 700; font-size: 13.5px; line-height: 1.4; color: var(--ink2); }
.tips { padding: 6px 6px; }
.tips h3 { font: 650 18px var(--display); margin: 4px 0 6px; }
.tips p { margin-bottom: 7px; }
.set-row { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); position: relative; }
.set-row > span { flex: 1; display: flex; flex-direction: column; }
.set-row b { font-weight: 800; font-size: 15.5px; }
.set-row small { color: var(--ink2); font-weight: 700; font-size: 12.5px; }
.set-row input { position: absolute; opacity: 0; pointer-events: none; }
.sw { width: 50px; height: 30px; border-radius: 99px; background: #d9cbb6; position: relative; transition: .2s; flex: none; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: .2s; }
.set-row input:checked + .sw { background: var(--sage); }
.set-row input:checked + .sw::after { left: 23px; }
.credits { padding: 4px 6px; }
.credits h3 { font: 650 18px var(--display); margin: 8px 0 6px; }
.credits p { margin: 0 0 6px; font-weight: 700; font-size: 13px; color: var(--ink2); line-height: 1.4; }
.danger { margin-top: 8px; padding: 13px; border-radius: 14px; border: 1.5px dashed rgba(170, 50, 40, .5); color: var(--madder-d); font-weight: 800; }

/* ---------- sheets ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(50, 30, 30, 0); display: flex; align-items: flex-end; justify-content: center; z-index: 40; transition: background .3s; }
.sheet-bg.on { background: rgba(50, 30, 30, .42); }
.sheet { width: min(100%, 520px); background: var(--paper); border-radius: 26px 26px 0 0; padding: 18px 20px calc(18px + var(--safe-b)); text-align: center; transform: translateY(100%); transition: transform .45s cubic-bezier(.2, .9, .25, 1.1); box-shadow: 0 -10px 40px -10px rgba(40,20,10,.5); position: relative; }
.sheet::before { content: ''; position: absolute; inset: 7px 7px 0; border-radius: 20px 20px 0 0; border: 1.6px dashed var(--line); border-bottom: 0; pointer-events: none; }
.sheet-bg.on .sheet { transform: none; }
.win-block { width: min(62vw, 250px); aspect-ratio: 1; margin: 0 auto; }
.win-cv { width: 100%; height: 100%; display: block; }
.sheet h2 { margin: 6px 0 2px; font: 700 28px var(--display); }
.sheet .sub { margin: 0; color: var(--ink2); font-weight: 700; font-size: 13.5px; }
.stars { display: flex; justify-content: center; gap: 6px; margin: 10px 0 2px; }
.stars .st svg { width: 38px; height: 38px; color: rgba(90, 60, 50, .18); transform: scale(.6); transition: transform .35s cubic-bezier(.3, 1.8, .5, 1), color .2s; }
.stars .st.pop svg { transform: scale(1); }
.stars .st.pop[data-on="1"] svg { color: #f2b230; filter: drop-shadow(0 2px 0 rgba(140, 80, 0, .45)); }
.stats { display: flex; justify-content: center; gap: 10px; margin: 10px 0 4px; }
.stat { background: rgba(255,255,255,.6); border-radius: 14px; padding: 7px 14px; min-width: 82px; }
.stat small { display: block; color: var(--ink2); font-weight: 800; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; }
.stat b { font-size: 18px; font-variant-numeric: tabular-nums; }
.reward { display: flex; gap: 6px; justify-content: center; align-items: center; margin: 8px 0 0; font-weight: 800; color: #8a5a10; font-size: 14px; }
.reward svg { width: 18px; height: 18px; }
.sheet-btns { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; margin-top: 14px; }
.btn { padding: 15px 10px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); font-weight: 800; font-size: 16px; }
.btn.primary { background: linear-gradient(180deg, #d4554b, #b93d35); color: #fff8ef; box-shadow: 0 10px 20px -10px rgba(150,40,30,.8); }
.link { margin-top: 10px; color: var(--ink2); font-weight: 800; font-size: 14px; padding: 6px 14px; }

/* ---------- loading ---------- */
.loading-sc, .loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--ink2); font-weight: 800; }
.spool-spin svg { width: 54px; height: 54px; color: var(--madder); animation: spin 1.2s ease-in-out infinite; }
@keyframes spin { 50% { transform: rotate(180deg) scale(.92); } 100% { transform: rotate(360deg); } }
.loading .ld-title { font: 700 40px var(--display); color: var(--ink); }

@media (max-height: 700px) { .hero { min-height: 120px; } .brand h1 { font-size: 42px; } .card { min-height: 56px; padding: 10px 12px; } }
@media (prefers-reduced-motion: reduce) { .brand-stitch path, .patch.current, .spool-spin svg { animation: none; } }
/* ===================== round 2 ===================== */
/* play layout: board as big as fits, anchored low for thumbs; legend + tutorial in the band above */
.stage { flex-direction: column; justify-content: flex-end; align-items: center; padding: 4px 4px 2px; gap: 6px; position: relative; }
.info { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 0 8px; }
.board-wrap { flex: none; position: relative; }
.teach { position: static; }
.stage.tight .info { position: absolute; left: 8px; right: 8px; top: 2px; z-index: 6; justify-content: flex-start; pointer-events: none; padding: 0; }
.stage.tight .legend-chips { display: none; }
.legend-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.lchip { display: flex; align-items: center; gap: 5px; padding: 5px 11px 5px 6px; border-radius: 99px; background: var(--card); box-shadow: var(--shadow); font-weight: 800; font-size: 13px; color: var(--ink); min-height: 34px; }
.lchip .chip-ic { width: 24px; height: 24px; }
.lchip:not(:has(canvas)) { padding-left: 11px; }
.clock.over { color: var(--madder-d); }
.tools { padding: 8px 14px calc(12px + var(--safe-b)); gap: 10px; }
.tool { padding: 12px 0 10px; min-height: 66px; }
@media (max-height: 700px) { .tool { min-height: 56px; padding: 8px 0 7px; } .tool i svg { width: 22px; height: 22px; } .status { padding-top: 0; } .topbar { padding-top: calc(6px + var(--safe-t)); } }

/* home footer chips */
.home-foot { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chipbtn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 2px 8px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); font-weight: 800; font-size: 12px; color: var(--ink); }
.chipbtn i svg { width: 21px; height: 21px; color: var(--madder-d); }
.ch-head em.new { font: 800 10.5px var(--ui); font-style: normal; background: var(--gold); color: #4a2c06; padding: 2px 7px; border-radius: 99px; letter-spacing: .4px; text-transform: uppercase; }

/* daily */
.daily { padding: 6px 16px calc(24px + var(--safe-b)); display: flex; flex-direction: column; gap: 12px; }
.streak-card { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, #d4554b, #b93d35); color: #fff7ee; border-radius: 20px; padding: 16px 18px; box-shadow: 0 10px 22px -10px rgba(150,40,30,.7); position: relative; }
.streak-card::after { content: ''; position: absolute; inset: 5px; border-radius: 15px; border: 1.6px dashed rgba(255,240,225,.55); pointer-events: none; }
.sc-main { display: flex; align-items: baseline; gap: 8px; }
.sc-main i svg { width: 26px; height: 26px; transform: translateY(4px); }
.sc-main b { font: 700 40px/1 var(--display); }
.sc-main span { font-weight: 800; font-size: 15px; }
.sc-side { display: flex; flex-direction: column; align-items: flex-end; font-weight: 800; font-size: 13px; opacity: .92; gap: 2px; }
.cal { background: var(--card); border-radius: 20px; padding: 12px; box-shadow: var(--shadow); }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-head h3 { margin: 0; font: 650 18px var(--display); }
.icon-btn.sm { width: 36px; height: 36px; border-radius: 12px; }
.icon-btn[disabled] { opacity: .35; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-dow { text-align: center; font-weight: 800; font-size: 11.5px; color: var(--ink2); padding-bottom: 2px; }
.cal-day { aspect-ratio: 1; border-radius: 10px; background: #f3e8d6; position: relative; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--ink2); }
.cal-day b { position: relative; z-index: 1; }
.cal-day.done { background: #fbe9c7; color: var(--ink); }
.cal-day.done i { position: absolute; inset: 5px; opacity: .85; }
.cal-day.done b { background: rgba(255,250,240,.85); border-radius: 6px; padding: 0 3px; font-size: 12px; }
.cal-day.today { box-shadow: 0 0 0 2.5px var(--madder) inset; }
.cal-day.future { opacity: .45; }
.btn.wide { width: 100%; }
.daily-done { background: var(--card); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); text-align: center; }
.daily-done p { margin: 0 0 10px; font-weight: 700; color: var(--ink2); }
